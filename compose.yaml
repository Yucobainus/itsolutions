services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: card
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://card:card@db:5432/card
    ports:
      - "127.0.0.1:${CARD_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

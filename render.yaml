services:
  - type: web
    name: developer-card-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: developer-card-db
          property: connectionString

databases:
  - name: developer-card-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
